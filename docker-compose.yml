services:
  app:
    container_name: vogit
    build: .
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://vogit_user:vogit_password@db:5432/vogit_db
      REPO_DRIVER: postgres
      PORT: 3000
    ports:
      - "3000:3000"
    command: bun run start
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: vogit-db
    environment:
      POSTGRES_USER: vogit_user
      POSTGRES_PASSWORD: vogit_password
      POSTGRES_DB: vogit_db
    ports:
      - "5432:5432"
    volumes:
      - vogit_db_data:/var/lib/postgresql

volumes:
  vogit_db_data: